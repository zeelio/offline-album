<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline in Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f1ec;
    --ink: #3a3d6a;
    --flap: #262626;
    --flap-hi: #2f2f2f;
    --flap-text: #ececec;
    --orange: #e07a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 90% at 100% 0%, #9fb8d2 0%, #bccddf 30%, rgba(220,228,236,0) 62%),
      linear-gradient(90deg, var(--paper) 0%, #f1f0ed 40%, #dfe6ee 70%, #c3d3e3 100%);
    font-family: 'Inter', system-ui, sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: 50% 50%;
  }
  .abs { position: absolute; }

  /* clouds */
  #clouds { position: absolute; left: 560px; top: 280px; width: 900px; height: 620px; pointer-events: none; opacity: .95; }

  /* handwriting */
  .note {
    position: absolute;
    font-family: 'Cedarville Cursive', cursive;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    white-space: pre;
    pointer-events: none;
  }

  /* draggable items */
  .drag {
    position: absolute;
    cursor: grab;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--r, 0deg)) scale(var(--s, 1));
    transition: transform .35s cubic-bezier(.2,.9,.3,1.2), filter .3s;
    will-change: transform;
  }
  .drag:hover { --s: 1.03; }
  .drag.dragging {
    cursor: grabbing;
    --s: 1.06;
    transition: transform .05s linear, filter .3s;
    filter: drop-shadow(0 22px 26px rgba(30,35,50,.28));
    z-index: 50 !important;
  }

  /* perforated photo */
  .photo {
    border-radius: 14px;
    overflow: hidden;
    background: #222;
    box-shadow: 0 10px 24px rgba(30,30,40,.22), 0 2px 4px rgba(0,0,0,.15);
  }
  .photo svg { display: block; width: 100%; height: 100%; }
  .photo::after {
    content: "";
    position: absolute; inset: 5px;
    border: 3px dotted rgba(255,255,255,.95);
    border-radius: 11px;
    pointer-events: none;
  }
  .photo.back { background: #7a2f22; }
  .photo.back::after { border-color: rgba(255,255,255,.85); }

  .bubble {
    width: 34px; height: 34px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(30,40,60,.18);
    animation: bob var(--t, 6s) ease-in-out infinite alternate;
  }
  .bubble svg { width: 100%; height: 100%; display: block; }
  @keyframes bob { from { translate: 0 -5px; } to { translate: 0 6px; } }

  /* flipboard */
  #board {
    position: absolute;
    left: 50%; top: 380px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 20;
    cursor: pointer;
  }
  .row {
    display: flex; gap: 3px;
    padding: 5px;
    background: linear-gradient(#1d1d1d, #141414);
    border-radius: 9px;
    box-shadow:
      0 18px 30px rgba(20,25,35,.28),
      0 4px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .cell {
    position: relative;
    width: 38px; height: 52px;
    perspective: 260px;
    font: 300 31px/52px 'Inter', sans-serif;
    color: var(--flap-text);
    text-align: center;
    letter-spacing: 0;
  }
  .cell .h, .cell .l {
    position: absolute; left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
  }
  .cell .t { top: 0; border-radius: 4px 4px 0 0; background: linear-gradient(var(--flap-hi), var(--flap)); }
  .cell .b { bottom: 0; border-radius: 0 0 4px 4px; background: linear-gradient(#232323, #1e1e1e); }
  .cell span { display: block; height: 52px; }
  .cell .b span { margin-top: -26px; }
  .cell .l.t { transform-origin: 50% 100%; z-index: 2; }
  .cell .l.b { transform-origin: 50% 0%; transform: rotateX(90deg); z-index: 2; }
  .cell::after {
    content: "";
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; margin-top: -.5px;
    background: rgba(0,0,0,.75);
    box-shadow: 0 1px 0 rgba(255,255,255,.05);
    z-index: 3;
  }
  .cell::before {
    /* hinge pins */
    content: "";
    position: absolute; left: -1px; right: -1px; top: 50%;
    height: 6px; margin-top: -3px;
    background: linear-gradient(90deg, #0d0d0d 0 2px, transparent 2px calc(100% - 2px), #0d0d0d calc(100% - 2px));
    z-index: 4;
  }

  /* postcard */
  #postcard { left: 905px; top: 545px; width: 500px; height: 340px; z-index: 10; --r: -3deg; }
  .scrap {
    position: absolute; left: 0; top: 0; width: 290px; height: 340px;
    background: radial-gradient(120% 120% at 30% 20%, #3a3a3a, #1d1d1d 70%);
    box-shadow: 0 14px 28px rgba(20,25,35,.3);
  }
  .scrap .holes {
    position: absolute; left: 8px; top: 12px; bottom: 12px; width: 8px;
    background: radial-gradient(circle, #0b0b0b 2.6px, transparent 3px) 0 0 / 8px 16px repeat-y;
  }
  .kraft {
    position: absolute; left: 26px; top: 20px; width: 250px; height: 300px;
    background: linear-gradient(#cdb48d, #bfa27a);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .glow {
    position: absolute; left: 150px; top: 30px; width: 130px; height: 260px;
    background:
      linear-gradient(90deg, rgba(0,0,0,.15), transparent 30%),
      linear-gradient(#2e2a26 0 22%, #f0b46a 22% 60%, #8a5a33 60% 72%, #3a2c22 72%);
    box-shadow: inset 0 0 30px rgba(0,0,0,.35);
  }
  .clip {
    position: absolute; left: 92px; top: 4px; width: 22px; height: 40px;
    border: 2.5px solid #b9bcc2; border-radius: 11px;
    transform: rotate(-8deg);
    z-index: 3;
  }
  .clip::after {
    content: ""; position: absolute; left: 3px; top: 6px; width: 12px; height: 26px;
    border: 2.5px solid #b9bcc2; border-radius: 7px; border-top: none;
  }
  .notebook {
    position: absolute; left: 262px; top: -6px; width: 245px; height: 350px;
    background:
      repeating-linear-gradient(transparent 0 17px, #d8dde6 17px 18px) 0 40px / 100% calc(100% - 40px) no-repeat,
      #fbfbf9;
    box-shadow: 0 14px 28px rgba(20,25,35,.22);
  }
  .notebook .rings {
    position: absolute; left: -7px; top: 8px; bottom: 8px; width: 14px;
    background: radial-gradient(circle at 50% 50%, #f2f2f2 0 3px, #9ea3aa 3.5px 5px, transparent 5.5px) 0 0 / 14px 17px repeat-y;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }

  /* trail */
  #trail { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
  .sticker {
    position: absolute; left: 0; top: 0;
    filter: drop-shadow(0 6px 8px rgba(30,30,40,.25));
    will-change: transform, opacity;
  }
  .sticker svg { display: block; width: 100%; height: 100%; }

  .hint {
    position: fixed; left: 16px; bottom: 14px;
    font: 400 12px/1.4 'Inter', sans-serif;
    color: rgba(58,61,106,.55);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
  }
</style>
</head>
<body>

It was just a lot of walking and

<script>
// ---------- scenes (all drawn, no external images) ----------
const scenes = {
  lake: `<svg viewBox="0 0 225 250" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c2da"/><stop offset="1" stop-color="#e3dde6"/></linearGradient>
      <linearGradient id="lwat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9bb6"/><stop offset="1" stop-color="#5f6f8a"/></linearGradient>
    </defs>
    <rect width="225" height="250" fill="url(#lsky)"/>
    <path d="M0 95 L40 70 L75 88 L115 60 L160 92 L225 80 V160 H0Z" fill="#a3adc4"/>
    <path d="M0 125 L30 105 L70 118 L110 98 L150 122 L190 110 L225 120 V165 H0Z" fill="#7d8aa6"/>
    <rect y="150" width="225" height="100" fill="url(#lwat)"/>
    <g transform="translate(18 150)"><rect x="0" y="6" width="58" height="10" rx="2" fill="#f2f2f2"/><rect x="0" y="12" width="58" height="3" fill="#b03c3c"/><rect x="10" y="0" width="34" height="7" fill="#e8e8e8"/><rect x="14" y="-4" width="18" height="5" fill="#ddd"/></g>
    <rect x="168" y="20" width="4" height="230" fill="#8c7d6a"/>
    <path d="M160 40 Q170 15 180 40 L184 150 Q170 160 156 150Z" fill="#d6cbbb"/>
    <path d="M170 40 L170 150" stroke="#b8ab98" stroke-width="2"/>
    <circle cx="15" cy="175" r="22" fill="#4d6b3a"/><circle cx="5" cy="200" r="20" fill="#3d5a2e"/>
    <g>
      <ellipse cx="40" cy="250" rx="30" ry="40" fill="#5a6a8a"/><circle cx="40" cy="196" r="11" fill="#e9e3dc"/>
      <ellipse cx="95" cy="252" rx="34" ry="42" fill="#2e3440"/><circle cx="95" cy="196" r="12" fill="#6b5d52"/>
      <ellipse cx="150" cy="250" rx="30" ry="38" fill="#e6e6ea"/><circle cx="150" cy="200" r="11" fill="#b49a85"/>
      <ellipse cx="200" cy="252" rx="28" ry="36" fill="#c7c9d1"/><circle cx="198" cy="205" r="10" fill="#efe6dc"/>
      <ellipse cx="122" cy="214" rx="9" ry="10" fill="#d9c6b0"/>
    </g>
  </svg>`,
  villa: `<svg viewBox="0 0 175 220" preserveAspectRatio="xMidYMid slice">
    <rect width="175" height="220" fill="#e4e9ef"/>
    <path d="M40 120 L95 40 L140 85 L175 70 V140 H40Z" fill="#a1abba"/>
    <path d="M60 130 L110 75 L175 110 V150 H60Z" fill="#8792a6"/>
    <rect y="135" width="175" height="20" fill="#b9c4d3"/>
    <path d="M0 0 H55 C40 40 60 80 45 140 L0 160Z" fill="#3e5a34"/>
    <circle cx="20" cy="40" r="30" fill="#4a6b3c"/><circle cx="40" cy="90" r="26" fill="#2f4a28"/>
    <rect x="98" y="120" width="8" height="22" fill="#7a3a2a"/>
    <path d="M30 150 L95 132 L175 148 V220 H30Z" fill="#a6553c"/>
    <g stroke="#8a4130" stroke-width="1.4">
      <path d="M40 162 L175 160"/><path d="M38 176 L175 174"/><path d="M36 190 L175 188"/><path d="M34 204 L175 202"/>
    </g>
    <path d="M0 160 L30 150 L40 220 H0Z" fill="#c9c2b6"/>
  </svg>`,
  brick: `<svg viewBox="0 0 170 215" preserveAspectRatio="xMidYMid slice">
    <rect width="170" height="215" fill="#8f3f30"/>
    <g fill="#7a3326">${Array.from({length:22},(_,i)=>`<rect x="${(i%2)*10}" y="${i*10}" width="170" height="1.5"/>`).join('')}</g>
    <rect x="60" y="10" width="60" height="22" fill="#2c2420"/><text x="90" y="25" text-anchor="middle" font-size="9" fill="#e8d9b5" font-family="Georgia">BAR</text>
    <rect x="30" y="60" width="40" height="70" fill="#c8c0b0"/><rect x="35" y="65" width="30" height="60" fill="#5b6470"/>
  </svg>`,
  brickTall: `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#6d5a52"/><rect x="12" y="4" width="16" height="36" fill="#9c4a33"/><rect x="16" y="10" width="8" height="10" fill="#e9dcc8"/></svg>`,
  lakeTiny: `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#dde3ee"/><path d="M0 22 L12 14 L22 20 L32 12 L40 18 V40 H0Z" fill="#7f8ea8"/><rect y="24" width="40" height="16" fill="#9fb0c8"/><rect x="10" y="25" width="10" height="3" fill="#fff"/></svg>`,
  trees: `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#5b6650"/><circle cx="12" cy="14" r="12" fill="#3f4f36"/><circle cx="28" cy="22" r="14" fill="#2f3d28"/><circle cx="20" cy="34" r="10" fill="#6e7a5c"/></svg>`,
  dome: `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#cfd8e6"/><rect x="8" y="22" width="24" height="18" fill="#d9c2a0"/><path d="M12 22 Q20 8 28 22Z" fill="#c89a6a"/><rect x="19" y="4" width="2" height="8" fill="#8a6a4a"/></svg>`,
};
document.querySelectorAll('[data-scene]').forEach(el => { el.insertAdjacentHTML('afterbegin', scenes[el.dataset.scene]); });

// ---------- stage scaling ----------
const stage = document.getElementById('stage');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / 1440, innerHeight / 900);
  if (innerWidth < innerHeight) scale = Math.min(innerWidth / 1000, innerHeight / 900);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener('resize', fit); fit();

// ---------- split-flap board ----------
const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const MESSAGES = [
  ['OFFLINE', 'IN EUROPE'],
  ['SLOW', 'MORNINGS'],
  ['LONG', 'WALKS'],
  ['NO WIFI', 'JUST SEA'],
  ['MAY', 'IN ITALY'],
];
let msgIndex = 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rows = [...document.querySelectorAll('.row')].map(row => {
  const cells = [];
  for (let i = 0; i < +row.dataset.len; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = '<div class="h t"><span></span></div><div class="h b"><span></span></div><div class="l t"><span></span></div><div class="l b"><span></span></div>';
    const [T, B, LT, LB] = c.querySelectorAll('div');
    const cell = { el: c, T, B, LT, LB, ch: ' ', token: 0 };
    setStatic(cell, ' ');
    row.appendChild(c);
    cells.push(cell);
  }
  return cells;
});

function setText(part, ch) { part.firstChild.textContent = ch; }
function setStatic(cell, ch) {
  cell.ch = ch;
  setText(cell.T, ch); setText(cell.B, ch); setText(cell.LT, ch); setText(cell.LB, ch);
}

function flip(cell, next, dur) {
  const prev = cell.ch;
  if (prev === next) return Promise.resolve();
  cell.ch = next;
  setText(cell.T, next);
  setText(cell.B, prev);
  setText(cell.LT, prev);
  setText(cell.LB, next);
  const down = cell.LT.animate(
    [{ transform: 'rotateX(0deg)', filter: 'brightness(1)' }, { transform: 'rotateX(-90deg)', filter: 'brightness(.55)' }],
    { duration: dur, easing: 'ease-in', fill: 'forwards' });
  return down.finished.then(() => {
    const up = cell.LB.animate(
      [{ transform: 'rotateX(90deg)', filter: 'brightness(1.4)' }, { transform: 'rotateX(0deg)', filter: 'brightness(1)' }],
      { duration: dur, easing: 'cubic-bezier(.2,1.6,.5,1)', fill: 'forwards' });
    return up.finished;
  }).then(() => {
    setText(cell.B, next);
    setText(cell.LT, next);
    down.cancel();
    cell.LB.getAnimations().forEach(a => a.cancel());
  });
}

const rand = s => s[Math.floor(Math.random() * s.length)];
async function spin(cell, target, flips, dur) {
  const token = ++cell.token;
  for (let i = 0; i < flips; i++) {
    if (token !== cell.token) return;
    await flip(cell, rand(CHARS), dur);
  }
  if (token !== cell.token) return;
  await flip(cell, target, dur * 1.4);
}

function pad(text, len) {
  const left = Math.floor((len - text.length) / 2);
  return (' '.repeat(left) + text).padEnd(len, ' ');
}

let busy = false;
function show(message, intensity = 1) {
  if (reduceMotion) {
    rows.forEach((cells, r) => { const t = pad(message[r], cells.length); cells.forEach((c, i) => setStatic(c, t[i])); });
    return Promise.resolve();
  }
  busy = true;
  const jobs = [];
  rows.forEach((cells, r) => {
    const t = pad(message[r], cells.length);
    cells.forEach((c, i) => {
      const flips = Math.round((4 + Math.random() * 6 + i * 1.4 + r * 3) * intensity);
      jobs.push(spin(c, t[i], flips, 38 + Math.random() * 18));
    });
  });
  return Promise.all(jobs).then(() => { busy = false; });
}

const board = document.getElementById('board');
board.addEventListener('pointerenter', () => { if (!busy && !dragging) show(MESSAGES[msgIndex], .7); });
function cycle() {
  msgIndex = (msgIndex + 1) % MESSAGES.length;
  board.setAttribute('aria-label', MESSAGES[msgIndex].join(' '));
  show(MESSAGES[msgIndex]);
}
board.addEventListener('click', cycle);
board.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(); } });
document.fonts.ready.then(() => setTimeout(() => show(MESSAGES[0], 1.4), 250));

// ---------- dragging ----------
let dragging = null;
let zTop = 30;
document.querySelectorAll('.drag').forEach(el => {
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // inner draggables (stamps) win over the postcard
    if (el.closest('.drag') !== e.target.closest('.drag')) return;
    e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    const dx = parseFloat(el.style.getPropertyValue('--dx')) || 0;
    const dy = parseFloat(el.style.getPropertyValue('--dy')) || 0;
    // nested items move in their parent's rotated frame; close enough at small angles
    dragging = { el, x0: e.clientX, y0: e.clientY, dx, dy, moved: false };
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!dragging || dragging.el !== el) return;
    const mx = (e.clientX - dragging.x0) / scale, my = (e.clientY - dragging.y0) / scale;
    if (Math.abs(mx) + Math.abs(my) > 3) dragging.moved = true;
    el.style.setProperty('--dx', dragging.dx + mx + 'px');
    el.style.setProperty('--dy', dragging.dy + my + 'px');
  });
  const end = () => {
    if (!dragging || dragging.el !== el) return;
    el.classList.remove('dragging');
    el.style.zIndex = el.hasAttribute('data-own') ? 12 : ++zTop;
    if (dragging.moved && !busy) show(MESSAGES[msgIndex], .5);
    dragging = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
});

const SIZES = { passport: [46, 62], compass: [58, 58], camera: [68, 50], globe: [52, 60], leaf: [62, 62], plane: [74, 42], van: [70, 46], stamp: [46, 56], polaroid: [48, 56], ticket: [72, 36], shell: [54, 48], lemon: [56, 46], espresso: [56, 44], map: [64, 52], sailboat: [56, 56] };
const KINDS = Object.keys(S);

const trail = document.getElementById('trail');
let last = null, travelled = 0, kindIdx = Math.floor(Math.random() * KINDS.length);
const GAP = 34;

function spawn(x, y, angle) {
  if (trail.childElementCount > 60) trail.firstElementChild.remove();
  const kind = KINDS[kindIdx++ % KINDS.length];
  const [w, h] = SIZES[kind];
  const k = Math.max(scale, .55) * (0.85 + Math.random() * .35);
  const el = document.createElement('div');
  el.className = 'sticker';
  el.style.width = w * k + 'px';
  el.style.height = h * k + 'px';
  el.innerHTML = S[kind];
  trail.appendChild(el);
  const r = (Math.random() - .5) * 40 + angle * .15;
  const base = `translate(${x - w * k / 2}px, ${y - h * k / 2}px)`;
  const drift = `translate(${x - w * k / 2}px, ${y - h * k / 2 + 14}px)`;
  el.animate([
    { transform: `${base} rotate(${r - 30}deg) scale(0)`, opacity: 0 },
    { transform: `${base} rotate(${r + 6}deg) scale(1.12)`, opacity: 1, offset: .14 },
    { transform: `${base} rotate(${r}deg) scale(1)`, opacity: 1, offset: .26 },
    { transform: `${base} rotate(${r}deg) scale(1)`, opacity: 1, offset: .62 },
    { transform: `${drift} rotate(${r + 12}deg) scale(.3)`, opacity: 0 },
  ], { duration: 1500, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' })
    .finished.then(() => el.remove());
}

addEventListener('pointermove', e => {
  if (reduceMotion || dragging) { last = null; return; }
  if (e.pointerType === 'touch' && e.buttons === 0) return;
  const p = { x: e.clientX, y: e.clientY };
  if (last) {
    const dx = p.x - last.x, dy = p.y - last.y;
    const d = Math.hypot(dx, dy);
    travelled += d;
    if (travelled > GAP * Math.max(scale, .6)) {
      travelled = 0;
      spawn(p.x, p.y, Math.atan2(dy, dx) * 180 / Math.PI);
    }
  }
  last = p;
});
addEventListener('pointerleave', () => { last = null; });
document.addEventListener('mouseleave', () => { last = null; });
</script>
